name: Notify GoldenNugget of Translation Updates

on:
  push:
    branches: [main]
    paths:
      - '**.ts'
      - '**.po'
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - '**.ts'
      - '**.po'

jobs:
  notify-goldennugget:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to GoldenNugget
        uses: peter-evans/repository-dispatch@v6
        with:
          token: ${{ secrets.GH_PAT }}
          repository: awesomenull-dev/GoldenNugget
          event-type: translations-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'